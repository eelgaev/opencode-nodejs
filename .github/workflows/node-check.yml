name: Node branch checks

on:
  push:
    branches: [v1, v2]
  pull_request:
    branches: [v1, v2]
  workflow_dispatch:
    inputs:
      version:
        description: Source branch to test
        required: true
        default: v2
        type: choice
        options: [v1, v2]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}
      - uses: ./.github/actions/fork-check
        with:
          version: ${{ inputs.version || github.base_ref || github.ref_name }}
      - name: Check generated workspace files
        run: git diff --exit-code
