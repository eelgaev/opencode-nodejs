name: Node branch checks

on:
  push:
    branches: [v1, v2]
  pull_request:
    branches: [v1, v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fork-check
        with:
          version: ${{ github.base_ref || github.ref_name }}
      - name: Check generated workspace files
        run: git diff --exit-code
